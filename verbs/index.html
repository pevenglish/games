<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irregular Verbs – Listen &amp; Learn</title>
<meta name="theme-color" content="#46178f">
<style>
:root{--bg:#46178f;--bg2:#25076b;--red:#e21b3c;--blue:#1368ce;--yellow:#d89e00;--green:#26890c;--ink:#1b1b1b;--muted:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Montserrat","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f4f1fa;color:var(--ink)}
button{font:inherit;border:0;cursor:pointer;background:none;color:inherit}
header{background:linear-gradient(160deg,var(--bg),var(--bg2));color:#fff;padding:18px 16px 70px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.top{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{background:#fff;border-radius:10px;padding:5px 9px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo img{height:42px;display:block}
h1{max-width:900px;margin:16px auto 4px;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900;line-height:1.1}
.sub{max-width:900px;margin:0 auto;opacity:.9;font-weight:600;font-size:.95rem}
.panel{max-width:900px;margin:-52px auto 0;padding:0 12px;position:relative;z-index:2}
.tools{background:#fff;border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.08),0 10px 30px rgba(70,23,143,.12);padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 200px;display:flex;align-items:center;gap:8px;background:#f2eff8;border-radius:10px;padding:0 12px}
.search input{flex:1;border:0;background:none;font:inherit;font-weight:700;font-size:1rem;padding:11px 0;outline:none;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid #ddd;border-radius:999px;padding:7px 12px;font-weight:800;font-size:.85rem;color:#444;background:#fff}
.chip.on{background:var(--bg);border-color:var(--bg);color:#fff}
.toggle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem;color:#444}
.sw{width:42px;height:24px;border-radius:99px;background:#ccc;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:var(--green)}.toggle.on .sw::after{left:21px}
.help{max-width:900px;margin:10px auto 0;padding:0 16px;color:var(--muted);font-weight:600;font-size:.85rem}
.head{max-width:900px;margin:14px auto 6px;padding:0 12px;display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:8px;font-weight:900;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.head span:nth-child(2){color:var(--red)}.head span:nth-child(3){color:var(--blue)}.head span:nth-child(4){color:var(--green)}
main{max-width:900px;margin:0 auto 40px;padding:0 12px;display:flex;flex-direction:column;gap:8px}
.pageTitle{font-weight:900;color:var(--bg);margin:14px 4px 2px;font-size:.95rem}
.row{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:8px;align-items:stretch;background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 0 rgba(0,0,0,.06);scroll-margin-top:80px}
.row.playing{outline:3px solid var(--yellow)}
.all{border-radius:10px;background:var(--bg);color:#fff;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.all:active{transform:scale(.95)}
.f{border-radius:10px;padding:8px 6px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:52px;border:2px solid transparent;transition:background .15s}
.f.c1{background:#fdecef}.f.c2{background:#e8f1fc}.f.c3{background:#e8f5e4}
.f.on{border-color:var(--ink)}
.f .w{font-weight:900;font-size:1.02rem;line-height:1.15;word-break:break-word}
.f .p{font-size:.78rem;color:#555;font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif}
.f .or{font-weight:700;color:#888;font-size:.8rem}
.f.hidden .w,.f.hidden .p,.f.hidden .or{visibility:hidden}
.f.hidden{background:repeating-linear-gradient(45deg,#eee,#eee 8px,#f6f6f6 8px,#f6f6f6 16px);position:relative}
.f.hidden::after{content:"tap to reveal";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;color:#999}
.more{grid-column:2 / 5;justify-self:start;font-size:.78rem;font-weight:800;color:var(--bg);background:#f2eff8;border-radius:999px;padding:4px 11px;margin-top:-1px}
.more[aria-expanded="true"]{background:var(--bg);color:#fff}
.info.closed{display:none}
.info{grid-column:2 / 5;display:flex;flex-direction:column;gap:3px;padding:2px 4px 2px;font-size:.86rem;line-height:1.35}
.info .def{color:#333}.info .def b{color:var(--bg)}
.info .ex{color:#555;font-style:italic}.info .ex b{color:var(--ink);font-style:normal}
.info .ex.hidden{cursor:pointer;filter:blur(5px);user-select:none}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:30px}
footer{text-align:center;color:var(--muted);font-size:.8rem;font-weight:600;padding:10px 0 30px}
@media (max-width:480px){ .f .w{font-size:.92rem} .f .p{font-size:.7rem} .row,.head{grid-template-columns:36px 1fr 1fr 1fr;gap:5px} .row{padding:6px} }
</style>
</head>

  let html="", last="";
  rows.forEach(([b,v2,v3,ip,def,ex])=>{
    const pg=pageOf(b);
    if(page==="all" && !term && pg!==last){ html+=`<div class="pageTitle">Page ${pg.slice(1)} · ${PAGES[pg][0]} – ${PAGES[pg][1]}</div>`; last=pg; }
    html+=`<div class="row" id="v-${b}"><button class="all" data-all="${b}" aria-label="Play all three forms of ${b}">▶</button>${cell(b,1,b,ip[0])}${cell(b,2,v2,ip[1])}${cell(b,3,v3,ip[2])}
      <button class="more" data-more="${b}" aria-expanded="false">📖 Meaning &amp; example</button>
      <div class="info closed" id="i-${b}"><div class="def">📖 <b>${esc(b)}</b>: ${esc(def)}</div><div class="ex${testMode?" hidden":""}" title="${testMode?"Tap to show the example":""}">✏️ ${ex}</div></div></div>`;
  });
  document.getElementById("list").innerHTML = html || `<div class="empty">No verb found 🙂</div>`;
  document.getElementById("help").textContent = `British English pronunciation · ${rows.length} verb${rows.length===1?"":"s"}`;
}
document.getElementById("list").addEventListener("click",e=>{
  const a=e.target.closest("[data-all]"); if(a){ playAll(a.dataset.all); return; }
  const mo=e.target.closest("[data-more]"); if(mo){ const box=document.getElementById("i-"+mo.dataset.more); const open=box.classList.toggle("closed")===false; mo.setAttribute("aria-expanded",open); mo.textContent=open?"📖 Hide":"📖 Meaning & example"; return; }
  const x=e.target.closest(".ex.hidden"); if(x){ x.classList.remove("hidden"); x.title=""; return; }
  const f=e.target.closest(".f"); if(!f) return;
  if(f.classList.contains("hidden")){ f.classList.remove("hidden"); }
  play(f.dataset.v, f.dataset.n);
});
document.getElementById("q").addEventListener("input",e=>{ q=e.target.value; render(); });
document.getElementById("pages").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return;
  document.querySelectorAll("#pages .chip").forEach(x=>x.classList.toggle("on",x===c)); page=c.dataset.p; render(); });
document.getElementById("test").addEventListener("click",e=>{ testMode=!testMode; e.currentTarget.classList.toggle("on",testMode); render(); });
render();
// #v-awake gibi bir bağlantıyla gelindiyse o fiile kaydır
if(location.hash.startsWith("#v-")){ const el=document.querySelector(location.hash); if(el){ el.scrollIntoView({block:"center"}); el.classList.add("playing"); setTimeout(()=>el.classList.remove("playing"),2500);} }
</script>
</body>
</html>
